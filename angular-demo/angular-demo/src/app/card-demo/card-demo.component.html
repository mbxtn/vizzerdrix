<div class="card-demo-container">
  <h2>Drag and Drop Scryfall Cards</h2>
  <div cdkDropList class="card-list" (cdkDropListDropped)="drop($event)">
    <div class="card-item" *ngFor="let card of cards" cdkDrag>
      <mat-card>
        <mat-card-header>
          <mat-card-title>{{ card.name }}</mat-card-title>
        </mat-card-header>
        <img mat-card-image [src]="card.image" [alt]="card.name" />
      </mat-card>
    </div>
  </div>
</div>
