<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebXR Prototype with A-Frame</title>
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <style>
    body { margin: 0; }
    #enter-vr-button {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      background: #222;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <button id="enter-vr-button">Enter VR</button>
  <a-scene embedded>
    <a-assets>
      <img id="card-image" src="tla-174-earth-rumble.png">
      <a-asset-item id="table" src="assets/table_medium.gltf"></a-asset-item>
    </a-assets>
    </a-assets>
    <a-plane position="0 0 -4" rotation="-90 0 0" width="8" height="8" color="#7BC8A4" shadow></a-plane>
    <a-sky color="#ECECEC"></a-sky>
    <a-gltf-model src="#table" position="0 0 -2">
    </a-gltf-model>
    <!-- Rig for stuff that should be player relative. -->
    <a-entity id="rig" position="0 0.2 -0.9">
      <a-camera position="0 3 0"></a-camera>
      <a-entity id="lefthandtracking" hand-tracking-controls="hand: left; modelOpacity: 0.25"
        pinchtohand="parent:#lefthandtracking; bound:#cardbox"></a-entity>
      <a-entity id="righthandtracking" hand-tracking-controls="hand: right;"></a-entity>
      <!-- position=".1 -.05 -.2" -->
      <a-box id="cardbox" color="#BDBDBD" depth="0.1" width="0.441" height="0.1" opacity=".25" rotation="90 90 0">
        <!-- position="0 0 -.2" rotation="90 90 0" -->
        <a-image src="#card-image" width="0.063" height="0.088"></a-image>
      </a-box>
    </a-entity>
  </a-scene>
  <script src="xrclient.js"></script>
</body>

</html>
