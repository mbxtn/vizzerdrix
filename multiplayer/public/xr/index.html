<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebXR Prototype with A-Frame</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    body { margin: 0; }
    #enter-vr-button {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      background: #222;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <button id="enter-vr-button">Enter VR</button>
  <a-scene embedded>
    <a-box position="0 1 -3" rotation="0 45 0" color="#4CC3D9" shadow></a-box>
    <a-sphere position="2 1 -5" radius="1" color="#EF2D5E" shadow></a-sphere>
    <a-cylinder position="-2 0.75 -4" radius="0.5" height="1.5" color="#FFC65D" shadow></a-cylinder>
    <a-plane position="0 0 -4" rotation="-90 0 0" width="8" height="8" color="#7BC8A4" shadow></a-plane>
    <a-sky color="#ECECEC"></a-sky>
  </a-scene>
  <script>
    // Simple VR button for A-Frame
    document.getElementById('enter-vr-button').addEventListener('click', function() {
      var scene = document.querySelector('a-scene');
      if (scene && scene.enterVR) scene.enterVR();
    });
  </script>
</body>
</html>
